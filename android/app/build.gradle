apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.google.devtools.ksp"
apply plugin: "com.facebook.react"
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "ai.offgridmobile"
    defaultConfig {
        applicationId "ai.offgridmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1784144537
        versionName "0.0.103"
        // Launcher label via a placeholder so a coexisting build type can rename itself.
        // Default keeps the real name (@string/app_name = "Off Grid AI"); releaseLocket overrides it.
        manifestPlaceholders = [appName: "@string/app_name"]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('OFFGRID_UPLOAD_STORE_FILE')) {
                storeFile file(OFFGRID_UPLOAD_STORE_FILE)
                storePassword OFFGRID_UPLOAD_STORE_PASSWORD
                keyAlias OFFGRID_UPLOAD_KEY_ALIAS
                keyPassword OFFGRID_UPLOAD_KEY_PASSWORD
            }
        }
    }
    lint {
        baseline = file("lint-baseline.xml")
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            // Amazon IAP's com.amazon.device.iap.ResponseReceiver (pulled in transitively
            // via RevenueCat) ships pre-Java-7 bytecode without stackmap frames. Robolectric
            // instantiates every receiver in the merged manifest during app setup, and that
            // class fails strict bytecode verification on JDK 17+ (VerifyError: "Expecting a
            // stackmap frame at branch target"). Relax verification for the unit-test JVM only.
            all {
                jvmArgs '-noverify'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".dev"
        }
        release {
            signingConfig signingConfigs.release.storeFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
        // A release-configured build (JS bundled, minified - production-like) but with the ".locket"
        // applicationId suffix + launcher name, so it installs ALONGSIDE the normal ai.offgridmobile
        // build instead of replacing it. Build: assembleReleaseLocket.
        releaseLocket {
            initWith release
            applicationIdSuffix ".locket"
            signingConfig signingConfigs.release.storeFile ? signingConfigs.release : signingConfigs.debug
            matchingFallbacks = ['release']
            manifestPlaceholders = [appName: "Off Grid Locket"]
        }
    }
    packaging {
        jniLibs {
            // Force compressed .so storage so Play Store extracts libs to nativeLibraryDir
            // as real filesystem files. Without this, AGP's default "uncompressed native libs"
            // stores .so files inside the APK zip — File.exists() returns false for them and
            // exec() fails with EACCES (error=13) because you can't fork-exec from a zip entry.
            useLegacyPackaging = true
            // libc++_shared.so is shipped by many native modules (reanimated, llama.rn,
            // whisper.rn, react-native-audio-api, executorch, gesture-handler, screens,
            // worklets, op-sqlite). pickFirst resolves the duplicate at merge time.
            // (No libonnxruntime.so entry: that collision no longer exists. It was between the
            // Whisper-NPU PoC's -qnn AAR and the OLD community sherpa AAR; the PoC is gone, and
            // since the switch to the official k2-fsa static build sherpa ships a single
            // libsherpa-onnx-jni.so with ORT linked in, no separate libonnxruntime.so.)
            pickFirsts += ['**/libc++_shared.so']
            // arm64-only: drop x86/x86_64/armeabi-v7a copies of EVERY native lib, including
            // those from dependency AARs (onnxruntime, litertlm, ...) that ndk.abiFilters can't
            // reach. Every flagship + BrowserStack real device is arm64-v8a. This cuts ~255 MB.
            // NOTE: also strips x86 from debug, so x86 EMULATORS won't run this build - use a
            // real arm64 device (or comment this out for emulator work). Test-build only.
            excludes += ['**/x86/**', '**/x86_64/**', '**/armeabi-v7a/**']
        }
    }
    aaptOptions {
        // Prevent AAPT from compressing .gguf model files — they must be copied byte-for-byte
        // 'zip': the bundled Cactus STT model zips (assets/cactus-models/*.zip) are already
        // compressed; storing them keeps the build fast and lets unzipAssets read them directly.
        noCompress 'gguf', 'zip'
    }
}

configurations.all {
    exclude group: 'com.android.support'
    // NOTE: do NOT re-add an `exclude` for com.microsoft.onnxruntime:onnxruntime-android. It
    // existed only while the -qnn AAR (a superset) was on the classpath for the Whisper-NPU PoC.
    // With that gone, this artifact is the ONLY thing providing ai.onnxruntime.*, which pro's
    // SileroVad needs for the recorder's live VAD gate - excluding it fails at runtime with
    // NoClassDefFoundError, not at build time.
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Coroutines for async operations (used by LocalDreamModule)
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

    // PDF text extraction (used by PDFExtractorModule)
    implementation("io.legere:pdfiumandroid:1.0.35")

    // LiteRT-LM on-device LLM inference (pinned — do not use latest.release)
    implementation("com.google.ai.edge.litertlm:litertlm-android:0.11.0")

    // (Whisper-on-NPU PoC dropped: the onnxruntime-android-qnn + qnn-runtime dependencies were
    // removed with it. ONNX Runtime is still needed on Android - pro's SileroVad (the recorder's
    // live VAD gate) is the one consumer of ai.onnxruntime.* - and pro declares
    // onnxruntime-android itself, so nothing needs to be declared here. Research kept in
    // pro/docs/plans/whisper-npu-poc-*.md; removed artifacts in ~/Desktop/offgrid-npu-archive.)

    // Download layer — Room + WorkManager + OkHttp
    def room_version = "2.8.2"
    implementation("androidx.room:room-runtime:$room_version")
    implementation("androidx.room:room-ktx:$room_version")
    ksp("androidx.room:room-compiler:$room_version")
    implementation("androidx.work:work-runtime-ktx:2.10.0")
    implementation("androidx.lifecycle:lifecycle-livedata-ktx:2.8.7")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")

    testImplementation("junit:junit:4.13.2")
    testImplementation("org.robolectric:robolectric:4.13")
    testImplementation("org.mockito:mockito-core:5.11.0")
    testImplementation("org.mockito.kotlin:mockito-kotlin:5.4.0")
    testImplementation("androidx.test:core:1.6.1")
}
